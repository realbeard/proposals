async function open(pw){
 const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(S),iterations:N,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
 const t=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(I)},k,d(C));
 return new TextDecoder().decode(t);
}
